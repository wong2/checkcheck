<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="170" y1="120" x2="850" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D343F"/>
      <stop offset="0.52" stop-color="#1A2028"/>
      <stop offset="1" stop-color="#101419"/>
    </linearGradient>
    <linearGradient id="edge" x1="180" y1="80" x2="810" y2="930" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="check" x1="375" y1="650" x2="790" y2="315" gradientUnits="userSpaceOnUse">
